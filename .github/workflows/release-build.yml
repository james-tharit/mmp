name: release-build

on:
  push:
    branches: ["release/**"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    goos: linux,  goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux,  goarch: arm64 }
          - { runner: macos-15-intel,   goos: darwin, goarch: amd64 }
          - { runner: macos-latest,     goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install ALSA headers
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - run: go vet ./...
      - run: go test ./...

      - name: Build
        run: |
          mkdir dist
          go build -trimpath -ldflags "-s -w" -o dist/mmp-${{ matrix.goos }}-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: mmp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mmp-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
